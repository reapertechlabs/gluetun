name: labels
on:
  push:
    branches: [master]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
jobs:
  labeler:
    permissions:
      issues: write
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@v6
      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
